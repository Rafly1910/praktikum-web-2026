<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portofolio Proyek - Modul 4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 30px 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #1e3a8a;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stats-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stats-card h3 {
            font-size: 13px;
            margin-bottom: 5px;
            color: #64748b;
            text-transform: uppercase;
        }
        .stats-card p {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
        }
        /* Form Input Proyek */
        .form-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        /* Input Pencarian */
        .search-group {
            margin-bottom: 15px;
        }
        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-filter {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-filter.active, .btn-filter:hover {
            background: #1e3a8a; 
            color: #ffffff; 
            border-color: #1e3a8a; 
        }
        .project-card { 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 12px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #ffffff; 
            transition: transform 0.15s ease; 
        }
        .project-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .project-info h4 { 
            font-size: 16px; 
            color: #0f172a; 
            margin-bottom: 4px; 
        }
        .project-category { 
            display: inline-block; 
            font-size: 12px; 
            color: #0284c7; 
            background: #e0f2fe; 
            padding:2px 8px; 
            border-radius: 4px; 
            margin-bottom: 6px; 
            font-weight: 600; 
        }
        .project-budget { 
            font-size: 14px; 
            color: #334155; 
            font-weight: 600; 
        }
        .badge { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
        }
        .badge-success { 
            background: #dcfce7; 
            color: #166534; 
        }
        .badge-pending { 
            background: #fef9c3; 
            color: #854d0e; }
        /* Tombol Aksi */
        .btn-action {
            padding: 4px 8px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-action:hover {
            opacity: 0.85;
        }
        .btn-toggle { background: #0284c7; color: white; }
        .btn-delete { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portofolio Proyek</h1>
        <p class="subtitle">Modul 4: Pengolahan Logika Data & Interaktivitas DOM</p>

 <!-- Kartu Ringkasan Statistik -->
<div class="stats-grid">
    <div class="stat-card">
        <h3>Total Proyek</h3>
        <p id="stat-total-projects">0</p>
    </div>
    <div class="stat-card">
        <h3>Total Anggaran</h3>
        <p id="stat-total-budget">Rp 0</p>
    </div>
    <div class="stat-card">
        <h3>Selesai Dikerjakan</h3>
        <p id="stat-completed-projects">0</p>
    </div>
</div>

<!-- Fitur 1: Form Input Proyek -->
  <div class="form-card">
    <h3 style="margin-bottom: 15px; font-size: 16px;">Tambah Proyek Baru</h3>
    <form id="project-form">
      <div class="form-group">
        <label>Judul Proyek</label>
        <input type="text" id="input-title" class="form-control" placeholder="Masukkan judul proyek" required>
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="input-category" class="form-control">
          <option value="Web App">Web App</option>
          <option value="Mobile App">Mobile App</option>
          <option value="Desktop App">Desktop App</option>
          <option value="UI/UX Design">UI/UX Design</option>
        </select>
      </div>
      <div class="form-group">
        <label>Estimasi Anggaran (Rp)</label>
        <input type="number" id="input-budget" class="form-control" placeholder="Contoh: 2500000" min="1" required>
      </div>
      <div class="form-group">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="input-completed"> Sudah Selesai
        </label>
      </div>
      <button type="submit" class="btn-submit">Tambah Proyek</button>
    </form>
  </div>


<!-- Fitur 2: Input Pencarian Real-Time -->
  <div class="search-group">
    <input type="text" id="search-input" class="form-control" placeholder="Cari nama proyek secara real-time...">
  </div>

<!-- Tombol Filter Kategori -->
 <div class="filter-group">
    <button class="btn-filter active" data-category="Semua">Semua Proyek</button>
    <button class="btn-filter" data-category="Web App">Web App</button>
    <button class="btn-filter" data-category="Desktop App">Desktop App</button>
    <button class="btn-filter" data-category="Mobile App">Mobile App</button>
    <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
 </div>

 <!-- Kontainer Daftar Proyek -->
    <div id="project-list"></div>
</div>

<script src="main.js"></script>
</body>
</html>
